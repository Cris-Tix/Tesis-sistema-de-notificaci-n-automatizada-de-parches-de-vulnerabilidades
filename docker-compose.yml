version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vuln_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - vuln-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "5433:5432"
    # postgres is intentionally NOT exposed to the host

  redis:
    image: redis:7
    container_name: vuln_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - vuln-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # redis is intentionally NOT exposed to the host

  n8n:
    image: n8nio/n8n:latest
    container_name: vuln_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # n8n core
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}

      # n8n authentication
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}

      # n8n database (uses PostgreSQL for its own metadata)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${POSTGRES_HOST}
      DB_POSTGRESDB_PORT: ${POSTGRES_PORT}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: public

      # n8n execution data persistence
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"

      # n8n Redis queue (cache / session)
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379

      # Timezone
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${TZ:-UTC}

      # External API keys (injected into n8n environment for use in Function Nodes)
      NVD_API_KEY: ${NVD_API_KEY}
      SHODAN_API_KEY: ${SHODAN_API_KEY}

      # SMTP
      N8N_EMAIL_MODE: smtp
      N8N_SMTP_HOST: ${SMTP_HOST}
      N8N_SMTP_PORT: ${SMTP_PORT}
      N8N_SMTP_USER: ${SMTP_USER}
      N8N_SMTP_PASS: ${SMTP_PASSWORD}
      N8N_SMTP_SENDER: ${SMTP_USER}

      # Alert destinations
      SECURITY_TEAM_EMAIL: ${SECURITY_TEAM_EMAIL}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_WEBHOOK_ESCALATION: ${SLACK_WEBHOOK_ESCALATION}

      # CISA KEV cache TTL
      CISA_KEV_CACHE_TTL_HOURS: ${CISA_KEV_CACHE_TTL_HOURS:-24}

    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - vuln-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  vuln-api:
    build:
      context: ./dashboard/backend
      dockerfile: Dockerfile
    container_name: vuln_api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - vuln-network
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  vuln-dashboard:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    container_name: vuln_dashboard
    restart: unless-stopped
    environment:
      # Cross-navigation URLs — injected into env.js at container start (not hardcoded).
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3001}
      LANDING_URL: ${LANDING_URL:-http://localhost:3002}
    networks:
      - vuln-network
    ports:
      - "3001:80"
    depends_on:
      - vuln-api

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: vuln_landing
    restart: unless-stopped
    environment:
      # Cross-navigation URLs — injected into env.js at container start (not hardcoded).
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3001}
      LANDING_URL: ${LANDING_URL:-http://localhost:3002}
    networks:
      - vuln-network
    ports:
      - "3002:80"

networks:
  vuln-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local
